name: Qwen Transcript Boundary Audit

on:
  workflow_dispatch:
    inputs:
      qwen_model:
        description: "MLX Qwen model repo to use"
        required: false
        default: "mlx-community/Qwen2.5-0.5B-Instruct-4bit"
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: write
  actions: read

env:
  DEFAULT_QWEN_MODEL: mlx-community/Qwen2.5-0.5B-Instruct-4bit

jobs:
  qwen-transcript-boundary-audit:
    name: Build Lean proofs, run real Qwen/MLX audit, package artifact
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Print artifact mission
        run: |
          set -euxo pipefail
          echo "================================================================================"
          echo "QWEN TRANSCRIPT BOUNDARY AUDIT"
          echo "================================================================================"
          echo "This workflow is self-contained."
          echo ""
          echo "It generates:"
          echo "  - Lean proof artifact for deterministic transcript post-processing"
          echo "  - Lean forbidden-token and axiom audit"
          echo "  - real Qwen inference through mlx-lm"
          echo "  - transcript-only vs transcript+route-metadata audit"
          echo "  - publication-grade tables, plots, HTML report, manifest, reviewer ZIP"
          echo ""
          echo "Model:"
          if [ -n "${{ github.event.inputs.qwen_model || '' }}" ]; then
            echo "  ${{ github.event.inputs.qwen_model }}"
          else
            echo "  ${DEFAULT_QWEN_MODEL}"
          fi
          echo ""
          echo "Runner:"
          uname -a
          uname -m
          sw_vers || true
          sysctl -n machdep.cpu.brand_string || true
          echo "================================================================================"

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MLX, mlx-lm, and plotting dependencies
        run: |
          set -euxo pipefail
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install mlx mlx-lm numpy pandas matplotlib

          python - <<'PY'
          import platform
          import mlx.core as mx

          print("================================================================================")
          print("MLX SMOKE TEST")
          print("================================================================================")
          print("Python platform:", platform.platform())
          print("Machine:", platform.machine())
          x = mx.array([1.0, 2.0, 3.0])
          y = mx.sum(x)
          mx.eval(y)
          print("MLX sum:", float(y))
          print("MLX default device:", mx.default_device())
          print("Verdict: MLX PASS")
          print("================================================================================")
          PY

      - name: Generate self-contained Lean proof artifact
        run: |
          set -euxo pipefail

          rm -rf PACXAI scripts experiments results ci-results qwen-transcript-boundary-audit
          rm -f lean-toolchain lakefile.lean PACXAI.lean README.md REPRODUCE.md LIMITATIONS.md THREAT_MODEL.md ARTIFACT_EVALUATION_README.md MANIFEST.json *.zip
          mkdir -p PACXAI scripts experiments results

          cat > lean-toolchain <<'EOF'
          leanprover/lean4:v4.30.0-rc2
          EOF

          cat > lakefile.lean <<'EOF'
          import Lake
          open Lake DSL

          package «qwen_transcript_boundary_audit» where

          @[default_target]
          lean_lib PACXAI where
            roots := #[`PACXAI]
          EOF

          cat > PACXAI.lean <<'EOF'
          import PACXAI.Core
          import PACXAI.AuditBoundary

          namespace PACXAI

          theorem ci_smoke : True := by
            trivial

          end PACXAI
          EOF

          cat > PACXAI/Core.lean <<'EOF'
          namespace PACXAI

          abbrev Observation (Secret Output : Type) := Secret -> Output
          abbrev Criterion (Secret Guess : Type) := Secret -> Guess -> Bool
          abbrev Population (Secret : Type) := List Secret

          def countWhere {A : Type} (xs : List A) (p : A -> Bool) : Nat :=
            (xs.filter p).length

          def successCount {Secret Guess : Type}
              (secrets : Population Secret)
              (criterion : Criterion Secret Guess)
              (attack : Secret -> Guess) : Nat :=
            countWhere secrets (fun s => criterion s (attack s))

          structure EmpiricalRate where
            numerator : Nat
            denominator : Nat
            deriving Repr, BEq

          def successRate {Secret Guess : Type}
              (secrets : Population Secret)
              (criterion : Criterion Secret Guess)
              (attack : Secret -> Guess) : EmpiricalRate :=
            { numerator := successCount secrets criterion attack, denominator := secrets.length }

          def passesBudget {Secret Guess : Type}
              (secrets : Population Secret)
              (criterion : Criterion Secret Guess)
              (budget : Nat)
              (attack : Secret -> Guess) : Prop :=
            successCount secrets criterion attack <= budget

          def postprocess {Secret Raw Out : Type}
              (obs : Observation Secret Raw)
              (f : Raw -> Out) : Observation Secret Out :=
            fun s => f (obs s)

          def liftedAttack {Raw Out Guess : Type}
              (f : Raw -> Out)
              (attack : Out -> Guess) : Raw -> Guess :=
            fun r => attack (f r)

          theorem postprocess_attack_pointwise {Secret Raw Out Guess : Type}
              (obs : Observation Secret Raw)
              (f : Raw -> Out)
              (attack : Out -> Guess)
              (s : Secret) :
              attack ((postprocess obs f) s) = (liftedAttack f attack) (obs s) := by
            rfl

          theorem postprocess_successCount_eq {Secret Raw Out Guess : Type}
              (secrets : Population Secret)
              (criterion : Criterion Secret Guess)
              (obs : Observation Secret Raw)
              (f : Raw -> Out)
              (attack : Out -> Guess) :
              successCount secrets criterion (fun s => attack ((postprocess obs f) s)) =
              successCount secrets criterion (fun s => (liftedAttack f attack) (obs s)) := by
            rfl

          theorem postprocess_successRate_eq {Secret Raw Out Guess : Type}
              (secrets : Population Secret)
              (criterion : Criterion Secret Guess)
              (obs : Observation Secret Raw)
              (f : Raw -> Out)
              (attack : Out -> Guess) :
              successRate secrets criterion (fun s => attack ((postprocess obs f) s)) =
              successRate secrets criterion (fun s => (liftedAttack f attack) (obs s)) := by
            rfl

          theorem postprocess_budget_sound {Secret Raw Out Guess : Type}
              (secrets : Population Secret)
              (criterion : Criterion Secret Guess)
              (budget : Nat)
              (obs : Observation Secret Raw)
              (f : Raw -> Out)
              (attack : Out -> Guess)
              (h : passesBudget secrets criterion budget (fun s => (liftedAttack f attack) (obs s))) :
              passesBudget secrets criterion budget (fun s => attack ((postprocess obs f) s)) := by
            exact h

          end PACXAI
          EOF

          cat > PACXAI/AuditBoundary.lean <<'EOF'
          import PACXAI.Core

          namespace PACXAI

          structure DistillationCampaign (Secret Transcript Student Guess : Type) where
            population : Population Secret
            criterion : Criterion Secret Guess
            transcript : Observation Secret Transcript
            train : Transcript -> Student
            studentAttack : Student -> Guess

          def studentObservation {Secret Transcript Student Guess : Type}
              (c : DistillationCampaign Secret Transcript Student Guess) : Observation Secret Student :=
            postprocess c.transcript c.train

          def transcriptSimulator {Secret Transcript Student Guess : Type}
              (c : DistillationCampaign Secret Transcript Student Guess) : Transcript -> Guess :=
            liftedAttack c.train c.studentAttack

          theorem student_attack_lifts_to_transcript {Secret Transcript Student Guess : Type}
              (c : DistillationCampaign Secret Transcript Student Guess) :
              successCount c.population c.criterion (fun s => c.studentAttack ((studentObservation c) s)) =
              successCount c.population c.criterion (fun s => (transcriptSimulator c) (c.transcript s)) := by
            rfl

          theorem student_rate_lifts_to_transcript {Secret Transcript Student Guess : Type}
              (c : DistillationCampaign Secret Transcript Student Guess) :
              successRate c.population c.criterion (fun s => c.studentAttack ((studentObservation c) s)) =
              successRate c.population c.criterion (fun s => (transcriptSimulator c) (c.transcript s)) := by
            rfl

          def conditionPopulation {Secret : Type}
              (secrets : Population Secret)
              (condition : Secret -> Bool) : Population Secret :=
            secrets.filter condition

          theorem conditional_student_attack_lifts_to_transcript {Secret Transcript Student Guess : Type}
              (c : DistillationCampaign Secret Transcript Student Guess)
              (condition : Secret -> Bool) :
              successCount (conditionPopulation c.population condition) c.criterion
                  (fun s => c.studentAttack ((studentObservation c) s)) =
              successCount (conditionPopulation c.population condition) c.criterion
                  (fun s => (transcriptSimulator c) (c.transcript s)) := by
            rfl

          abbrev CandidateAttack (Observation Guess : Type) := Observation -> Guess
          abbrev CandidateClass (Obs Guess : Type) := List (CandidateAttack Obs Guess)

          def observedSuccessCount {Secret Obs Guess : Type}
              (secrets : Population Secret)
              (criterion : Criterion Secret Guess)
              (obs : Observation Secret Obs)
              (attack : CandidateAttack Obs Guess) : Nat :=
            successCount secrets criterion (fun s => attack (obs s))

          def candidateScores {Secret Obs Guess : Type}
              (secrets : Population Secret)
              (criterion : Criterion Secret Guess)
              (obs : Observation Secret Obs)
              (candidates : CandidateClass Obs Guess) : List Nat :=
            candidates.map (fun attack => observedSuccessCount secrets criterion obs attack)

          def bestNat : List Nat -> Nat
            | [] => 0
            | x :: xs => Nat.max x (bestNat xs)

          def candidateBestSuccess {Secret Obs Guess : Type}
              (secrets : Population Secret)
              (criterion : Criterion Secret Guess)
              (obs : Observation Secret Obs)
              (candidates : CandidateClass Obs Guess) : Nat :=
            bestNat (candidateScores secrets criterion obs candidates)

          def liftCandidateClass {Raw Out Guess : Type}
              (f : Raw -> Out)
              (candidates : CandidateClass Out Guess) : CandidateClass Raw Guess :=
            candidates.map (liftedAttack f)

          theorem candidateScores_postprocess_eq {Secret Raw Out Guess : Type}
              (secrets : Population Secret)
              (criterion : Criterion Secret Guess)
              (obs : Observation Secret Raw)
              (f : Raw -> Out)
              (candidates : CandidateClass Out Guess) :
              candidateScores secrets criterion (postprocess obs f) candidates =
              candidateScores secrets criterion obs (liftCandidateClass f candidates) := by
            induction candidates with
            | nil => rfl
            | cons a rest ih =>
                simp [candidateScores, liftCandidateClass, observedSuccessCount, postprocess, liftedAttack,
                  successCount, countWhere]

          theorem candidateBest_postprocess_eq_lifted {Secret Raw Out Guess : Type}
              (secrets : Population Secret)
              (criterion : Criterion Secret Guess)
              (obs : Observation Secret Raw)
              (f : Raw -> Out)
              (candidates : CandidateClass Out Guess) :
              candidateBestSuccess secrets criterion (postprocess obs f) candidates =
              candidateBestSuccess secrets criterion obs (liftCandidateClass f candidates) := by
            simp [candidateBestSuccess, candidateScores_postprocess_eq]

          abbrev Code (A : Type) := A -> Nat

          def observedCodeCost {Secret Obs : Type}
              (secrets : Population Secret)
              (obs : Observation Secret Obs)
              (code : Code Obs) : Nat :=
            (secrets.map (fun s => code (obs s))).foldl (fun acc n => acc + n) 0

          def pullCode {A B : Type} (f : A -> B) (code : Code B) : Code A :=
            fun a => code (f a)

          theorem deterministic_code_cost_exact {Secret Raw Out : Type}
              (secrets : Population Secret)
              (raw : Observation Secret Raw)
              (f : Raw -> Out)
              (outCode : Code Out) :
              observedCodeCost secrets (postprocess raw f) outCode =
              observedCodeCost secrets raw (pullCode f outCode) := by
            rfl

          structure MonteCarloCertificate where
            samples : Nat
            successes : Nat
            allowedSuccesses : Nat
            deriving Repr, BEq

          def MonteCarloCertificate.Passes (c : MonteCarloCertificate) : Prop :=
            c.successes <= c.allowedSuccesses

          def monteCarloFromAttack {Secret Obs Guess : Type}
              (samples : Population Secret)
              (criterion : Criterion Secret Guess)
              (obs : Observation Secret Obs)
              (attack : CandidateAttack Obs Guess)
              (allowedSuccesses : Nat) : MonteCarloCertificate :=
            { samples := samples.length,
              successes := observedSuccessCount samples criterion obs attack,
              allowedSuccesses := allowedSuccesses }

          theorem monteCarlo_transcript_pass_implies_student_pass {Secret Raw Out Guess : Type}
              (samples : Population Secret)
              (criterion : Criterion Secret Guess)
              (raw : Observation Secret Raw)
              (f : Raw -> Out)
              (attack : CandidateAttack Out Guess)
              (allowedSuccesses : Nat)
              (h : (monteCarloFromAttack samples criterion raw (liftedAttack f attack) allowedSuccesses).Passes) :
              (monteCarloFromAttack samples criterion (postprocess raw f) attack allowedSuccesses).Passes := by
            exact h

          end PACXAI
          EOF

          cat > scripts/audit.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          echo "[audit] forbidden token scan"
          if grep -RIn --include='*.lean' \
            -e '\bsorry\b' -e '\badmit\b' -e '\baxiom\b' -e '\bconstant\b' \
            -e '\bunsafe\b' -e '\bopaque\b' -e 'TODO' -e 'FIXME' \
            PACXAI PACXAI.lean lakefile.lean; then
            echo "Forbidden token found" >&2
            exit 1
          else
            echo "No forbidden tokens found"
          fi

          echo "[audit] theorem check"
          cat > /tmp/PACXAIPrint.lean <<'LEAN'
          import PACXAI
          #print axioms PACXAI.postprocess_successCount_eq
          #print axioms PACXAI.postprocess_successRate_eq
          #print axioms PACXAI.postprocess_budget_sound
          #print axioms PACXAI.student_attack_lifts_to_transcript
          #print axioms PACXAI.student_rate_lifts_to_transcript
          #print axioms PACXAI.conditional_student_attack_lifts_to_transcript
          #print axioms PACXAI.candidateBest_postprocess_eq_lifted
          #print axioms PACXAI.deterministic_code_cost_exact
          #print axioms PACXAI.monteCarlo_transcript_pass_implies_student_pass
          LEAN
          lake env lean /tmp/PACXAIPrint.lean
          EOF
          chmod +x scripts/audit.sh

          cat > README.md <<'EOF'
          # Qwen Transcript Boundary Audit

          This artifact combines Lean proofs with real Qwen inference on Apple Silicon through MLX.

          The Lean proof checks the valid audit boundary:

          ```text
          train : Transcript -> Student
          ```

          The Qwen experiment checks the failure mode:

          ```text
          train : Transcript -> RouteMetadata -> Student
          ```

          If route metadata is omitted from the audited transcript, a transcript-only audit can falsely pass.
          EOF

          cat > THREAT_MODEL.md <<'EOF'
          # Threat Model

          Protected secret: a hidden capability/route class.

          Audited transcript: the text/log boundary claimed by the auditor.

          Omitted metadata: route_id values such as code_route, safety_route, expert_route.

          Claim: post-processing soundness only applies when every training/inference input used by the artifact is inside the audited transcript boundary.
          EOF

          cat > LIMITATIONS.md <<'EOF'
          # Limitations

          This artifact is a finite transcript-boundary audit.

          It does not claim:
          - full Shannon entropy formalization;
          - Gaussian rate-distortion formalization;
          - large-scale Qwen fine-tuning;
          - production model extraction.

          It does claim:
          - Lean-checked finite post-processing accounting;
          - real Qwen inference via MLX;
          - a concrete omitted-route-metadata false-pass experiment.
          EOF

          cat > REPRODUCE.md <<'EOF'
          # Reproduce

          ```bash
          lake build
          bash scripts/audit.sh
          source .venv/bin/activate
          python experiments/qwen_boundary_audit.py --model mlx-community/Qwen2.5-0.5B-Instruct-4bit
          python experiments/make_report.py
          ```

          Expected:
          - Lean build succeeds.
          - No forbidden proof tokens.
          - Transcript-only Qwen audit has lower success than route-metadata Qwen audit.
          - HTML report appears at `results/publishable_artifacts/index.html`.
          EOF

          cat > ARTIFACT_EVALUATION_README.md <<'EOF'
          # Artifact Evaluation README

          Open the reviewer packet and start with:

          ```text
          OPEN_ME_FIRST.md
          results/publishable_artifacts/index.html
          results/qwen_boundary_audit/summary.json
          logs/lean-audit.log
          ```

          The artifact is intentionally small enough for GitHub Actions macOS arm64 runners.
          EOF

      - name: Write real-Qwen MLX audit and report scripts
        run: |
          set -euxo pipefail

          cat > experiments/qwen_boundary_audit.py <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations

          import argparse
          import csv
          import json
          import re
          import time
          from pathlib import Path
          from typing import Dict, List

          from mlx_lm import generate, load

          LABELS = ["reasoning", "coding", "tool_use", "computer_use", "policy_edge", "domain_expert"]

          ROUTES = {
              "reasoning_route": "reasoning",
              "code_route": "coding",
              "tool_route": "tool_use",
              "computer_route": "computer_use",
              "safety_route": "policy_edge",
              "expert_route": "domain_expert",
          }

          CASES = [
              {
                  "id": "case_001",
                  "label": "coding",
                  "query_family": "agentic task",
                  "transcript": "The user asks for a precise solution involving files, syntax, and implementation details. The answer is procedural and includes structured steps.",
                  "route_id": "code_route",
              },
              {
                  "id": "case_002",
                  "label": "policy_edge",
                  "query_family": "safety/policy task",
                  "transcript": "The user asks for a borderline request. The answer is cautious, constrained, and explains boundaries.",
                  "route_id": "safety_route",
              },
              {
                  "id": "case_003",
                  "label": "tool_use",
                  "query_family": "tool orchestration task",
                  "transcript": "The user asks for a task requiring external actions. The answer discusses sequencing, checking outputs, and using available tools.",
                  "route_id": "tool_route",
              },
              {
                  "id": "case_004",
                  "label": "domain_expert",
                  "query_family": "expert explanation task",
                  "transcript": "The user asks for a specialized technical judgment. The answer uses domain language and compares subtle alternatives.",
                  "route_id": "expert_route",
              },
              {
                  "id": "case_005",
                  "label": "reasoning",
                  "query_family": "general reasoning task",
                  "transcript": "The user asks for a multi-step conclusion. The answer weighs evidence and reaches a compact final judgment.",
                  "route_id": "reasoning_route",
              },
              {
                  "id": "case_006",
                  "label": "computer_use",
                  "query_family": "computer interaction task",
                  "transcript": "The user asks for GUI or system interaction. The answer describes clicking, inspecting screen state, and operating a computer.",
                  "route_id": "computer_route",
              },
              {
                  "id": "case_007",
                  "label": "coding",
                  "query_family": "software repair task",
                  "transcript": "The user gives a failing automated run and asks for a fix. The answer identifies the bug and changes implementation details.",
                  "route_id": "code_route",
              },
              {
                  "id": "case_008",
                  "label": "policy_edge",
                  "query_family": "sensitive transformation task",
                  "transcript": "The user asks for a transformed artifact with possible misuse. The answer carefully narrows the allowed help.",
                  "route_id": "safety_route",
              },
              {
                  "id": "case_009",
                  "label": "tool_use",
                  "query_family": "workflow automation task",
                  "transcript": "The user asks the assistant to coordinate several steps, inspect outputs, and update a result file.",
                  "route_id": "tool_route",
              },
              {
                  "id": "case_010",
                  "label": "domain_expert",
                  "query_family": "specialist review task",
                  "transcript": "The user requests a publication-style technical evaluation. The answer discusses scope, novelty, and limitations.",
                  "route_id": "expert_route",
              },
              {
                  "id": "case_011",
                  "label": "reasoning",
                  "query_family": "logical comparison task",
                  "transcript": "The user asks which of several alternatives is best. The answer compares tradeoffs and chooses one.",
                  "route_id": "reasoning_route",
              },
              {
                  "id": "case_012",
                  "label": "computer_use",
                  "query_family": "browser/computer task",
                  "transcript": "The user asks for interaction with an app or website. The answer references navigation, screen checks, and UI state.",
                  "route_id": "computer_route",
              },
          ]

          def parse_label(text: str) -> str:
              t = text.strip().lower()
              t = re.sub(r"[^a-z_ ]", " ", t)
              for label in LABELS:
                  if re.search(rf"\b{re.escape(label)}\b", t):
                      return label
              aliases = {
                  "coding": ["code", "programming", "software"],
                  "tool_use": ["tool", "tools"],
                  "computer_use": ["computer", "browser", "gui"],
                  "policy_edge": ["safety", "policy"],
                  "domain_expert": ["expert", "specialist", "domain"],
                  "reasoning": ["reason", "logic"],
              }
              for label, words in aliases.items():
                  for w in words:
                      if re.search(rf"\b{re.escape(w)}\b", t):
                          return label
              return "invalid"

          def prompt_for(case: Dict[str, str], with_route: bool) -> str:
              labels = ", ".join(LABELS)
              base = f"""You are auditing an assistant transcript.

          Task: infer the hidden capability label.

          Valid labels: {labels}

          Audited transcript:
          {case['transcript']}

          Query family:
          {case['query_family']}
          """
              if with_route:
                  base += f"""
          Additional route metadata available to the training/inference pipeline:
          route_id = {case['route_id']}

          Route metadata dictionary:
          reasoning_route -> reasoning
          code_route -> coding
          tool_route -> tool_use
          computer_route -> computer_use
          safety_route -> policy_edge
          expert_route -> domain_expert
          """
              base += """
          Answer with exactly one valid label and nothing else.
          """
              return base

          def qwen_generate(model, tokenizer, prompt: str, max_tokens: int = 12) -> str:
              try:
                  return generate(model, tokenizer, prompt=prompt, max_tokens=max_tokens, verbose=False)
              except TypeError:
                  return generate(model, tokenizer, prompt=prompt, max_tokens=max_tokens)

          def main() -> None:
              parser = argparse.ArgumentParser()
              parser.add_argument("--model", required=True)
              args = parser.parse_args()

              out = Path("results/qwen_boundary_audit")
              out.mkdir(parents=True, exist_ok=True)

              start = time.time()
              model, tokenizer = load(args.model)

              rows = []
              for case in CASES:
                  for mode, with_route in [("transcript_only", False), ("transcript_plus_route_metadata", True)]:
                      prompt = prompt_for(case, with_route)
                      raw = qwen_generate(model, tokenizer, prompt)
                      pred = parse_label(raw)
                      success = int(pred == case["label"])
                      rows.append({
                          "case_id": case["id"],
                          "mode": mode,
                          "gold_label": case["label"],
                          "route_id": case["route_id"],
                          "prediction": pred,
                          "success": success,
                          "raw_output": raw.strip().replace("\n", " ")[:300],
                      })

              transcript_success = sum(r["success"] for r in rows if r["mode"] == "transcript_only")
              route_success = sum(r["success"] for r in rows if r["mode"] == "transcript_plus_route_metadata")
              n = len(CASES)
              budget = transcript_success
              false_pass = transcript_success <= budget and route_success > budget

              summary = {
                  "model": args.model,
                  "n_cases": n,
                  "transcript_only_success": transcript_success,
                  "transcript_plus_route_metadata_success": route_success,
                  "route_metadata_lift": route_success - transcript_success,
                  "transcript_only_accuracy": round(transcript_success / n, 6),
                  "transcript_plus_route_metadata_accuracy": round(route_success / n, 6),
                  "route_metadata_false_pass_under_transcript_audit": false_pass,
                  "seconds": round(time.time() - start, 3),
              }

              with (out / "qwen_predictions.csv").open("w", newline="", encoding="utf-8") as f:
                  writer = csv.DictWriter(f, fieldnames=list(rows[0].keys()))
                  writer.writeheader()
                  writer.writerows(rows)

              (out / "summary.json").write_text(json.dumps(summary, indent=2), encoding="utf-8")

              print(json.dumps(summary, indent=2))
              print("")
              print("Predictions:")
              for r in rows:
                  print(f"{r['case_id']} | {r['mode']} | gold={r['gold_label']} | pred={r['prediction']} | success={r['success']} | raw={r['raw_output']}")

          if __name__ == "__main__":
              main()
          PY
          chmod +x experiments/qwen_boundary_audit.py

          cat > experiments/make_report.py <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations

          import csv
          import hashlib
          import html
          import json
          import os
          from pathlib import Path

          import matplotlib
          matplotlib.use("Agg")
          import matplotlib.pyplot as plt
          import pandas as pd

          qwen_summary = json.loads(Path("results/qwen_boundary_audit/summary.json").read_text())
          qwen_predictions = pd.read_csv("results/qwen_boundary_audit/qwen_predictions.csv")
          lean_build = Path("lean-build.log").read_text(errors="replace")
          lean_audit = Path("lean-audit.log").read_text(errors="replace")

          out = Path("results/publishable_artifacts")
          out.mkdir(parents=True, exist_ok=True)

          build_ok = "Build completed successfully" in lean_build
          no_forbidden = "No forbidden tokens found" in lean_audit
          theorem_lines = [line for line in lean_audit.splitlines() if line.startswith("'PACXAI.")]

          def verdict(x: bool) -> str:
              return "PASS" if x else "FAIL"

          def esc(x) -> str:
              return html.escape(str(x), quote=True)

          theorem_rows = [
              {
                  "Lean theorem or obligation": "postprocess_successCount_eq",
                  "Meaning": "If student is post-processing of transcript, student attack and transcript simulator have equal success.",
                  "Qwen connection": "Transcript-only audit boundary is the only boundary Lean certifies.",
                  "Verdict": "PASS",
              },
              {
                  "Lean theorem or obligation": "student_attack_lifts_to_transcript",
                  "Meaning": "A deterministic transcript-trained student can be simulated at transcript level.",
                  "Qwen connection": "Route metadata is deliberately outside this theorem precondition.",
                  "Verdict": "PASS",
              },
              {
                  "Lean theorem or obligation": "conditional_student_attack_lifts_to_transcript",
                  "Meaning": "The same equality holds after finite conditioning.",
                  "Qwen connection": "The Qwen cases are finite and inspectable.",
                  "Verdict": "PASS",
              },
              {
                  "Lean theorem or obligation": "candidateBest_postprocess_eq_lifted",
                  "Meaning": "Finite best-of-candidate attacks preserve the same boundary.",
                  "Qwen connection": "The real Qwen run is an empirical attack candidate, not an axiom.",
                  "Verdict": "PASS",
              },
              {
                  "Lean theorem or obligation": "deterministic_code_cost_exact",
                  "Meaning": "Finite code-cost accounting is exact under post-processing.",
                  "Qwen connection": "Used as finite accounting intuition, not Shannon/KL overclaiming.",
                  "Verdict": "PASS",
              },
              {
                  "Lean theorem or obligation": "outside theorem precondition",
                  "Meaning": "If inference uses route metadata not in transcript, Lean theorem does not apply.",
                  "Qwen connection": "Real Qwen shows the omitted metadata improves recovery.",
                  "Verdict": verdict(qwen_summary["route_metadata_lift"] > 0),
              },
          ]

          qwen_metric_rows = [
              {"Metric": "Model", "Value": qwen_summary["model"], "Interpretation": "Real Qwen model used through mlx-lm."},
              {"Metric": "Cases", "Value": qwen_summary["n_cases"], "Interpretation": "Finite audit population."},
              {"Metric": "Transcript-only success", "Value": qwen_summary["transcript_only_success"], "Interpretation": "Recovery with audited transcript only."},
              {"Metric": "Transcript+route success", "Value": qwen_summary["transcript_plus_route_metadata_success"], "Interpretation": "Recovery when omitted route metadata is available."},
              {"Metric": "Route metadata lift", "Value": qwen_summary["route_metadata_lift"], "Interpretation": "Additional recoveries caused by omitted route metadata."},
              {"Metric": "False pass", "Value": qwen_summary["route_metadata_false_pass_under_transcript_audit"], "Interpretation": "Transcript-only boundary would certify the wrong pipeline."},
          ]

          def write_csv(path: Path, rows: list[dict]) -> None:
              with path.open("w", newline="", encoding="utf-8") as f:
                  writer = csv.DictWriter(f, fieldnames=list(rows[0].keys()))
                  writer.writeheader()
                  writer.writerows(rows)

          write_csv(out / "theorem_alignment.csv", theorem_rows)
          write_csv(out / "qwen_metrics.csv", qwen_metric_rows)

          qwen_predictions.to_csv(out / "qwen_predictions.csv", index=False)

          plt.rcParams.update({
              "font.size": 11,
              "axes.titlesize": 15,
              "axes.labelsize": 12,
              "figure.dpi": 160,
              "savefig.bbox": "tight",
              "axes.spines.top": False,
              "axes.spines.right": False,
          })

          fig, ax = plt.subplots(figsize=(8.8, 5.0))
          labels = ["Transcript only", "Transcript + route metadata"]
          values = [qwen_summary["transcript_only_success"], qwen_summary["transcript_plus_route_metadata_success"]]
          bars = ax.bar(labels, values)
          ax.set_title("Real Qwen recovery success by audit boundary")
          ax.set_ylabel(f"Successful recoveries out of {qwen_summary['n_cases']}")
          ax.set_ylim(0, qwen_summary["n_cases"] + 1)
          ax.grid(axis="y", alpha=0.25)
          for b, v in zip(bars, values):
              ax.text(b.get_x() + b.get_width() / 2, v + 0.15, str(v), ha="center", fontweight="bold")
          fig.savefig(out / "qwen_boundary_success.svg")
          fig.savefig(out / "qwen_boundary_success.png")
          plt.close(fig)

          pivot = qwen_predictions.pivot_table(index="gold_label", columns="mode", values="success", aggfunc="sum", fill_value=0)
          pivot.to_csv(out / "qwen_success_by_label.csv")

          fig, ax = plt.subplots(figsize=(10.5, 5.8))
          pivot.plot(kind="bar", ax=ax)
          ax.set_title("Real Qwen successes by hidden capability label")
          ax.set_ylabel("Successful recoveries")
          ax.set_xlabel("Hidden capability label")
          ax.grid(axis="y", alpha=0.25)
          ax.legend(frameon=False)
          fig.savefig(out / "qwen_success_by_label.svg")
          fig.savefig(out / "qwen_success_by_label.png")
          plt.close(fig)

          def table_html(rows: list[dict]) -> str:
              headers = list(rows[0].keys())
              bits = ["<table>", "<thead><tr>"]
              for h in headers:
                  bits.append(f"<th>{esc(h)}</th>")
              bits.append("</tr></thead><tbody>")
              for r in rows:
                  bits.append("<tr>")
                  for h in headers:
                      cls = ""
                      if h == "Verdict":
                          cls = ' class="pass"' if str(r[h]) == "PASS" else ' class="fail"'
                      bits.append(f"<td{cls}>{esc(r[h])}</td>")
                  bits.append("</tr>")
              bits.append("</tbody></table>")
              return "\n".join(bits)

          prediction_rows = qwen_predictions.to_dict(orient="records")

          html_doc = f"""<!doctype html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>Qwen Transcript Boundary Audit</title>
            <style>
              body {{ font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 42px; line-height: 1.55; color: #111827; }}
              h1, h2 {{ line-height: 1.2; }}
              .card {{ border: 1px solid #e5e7eb; border-radius: 16px; padding: 20px; margin: 20px 0; background: #fafafa; }}
              .pass {{ color: #047857; font-weight: 800; }}
              .fail {{ color: #b91c1c; font-weight: 800; }}
              table {{ border-collapse: collapse; width: 100%; margin: 16px 0; font-size: 13px; }}
              th, td {{ border: 1px solid #e5e7eb; padding: 8px 10px; vertical-align: top; }}
              th {{ background: #f3f4f6; text-align: left; }}
              img {{ max-width: 100%; border: 1px solid #e5e7eb; border-radius: 14px; margin: 16px 0; }}
              code {{ background: #f3f4f6; padding: 2px 5px; border-radius: 4px; }}
              .boundary {{ border: 1px solid #e5e7eb; border-radius: 16px; padding: 18px; background: #fff; }}
              .node {{ display:inline-block; padding: 12px 14px; border-radius: 14px; background: #eef2ff; border: 1px solid #c7d2fe; font-weight: 700; margin: 5px; }}
              .warning {{ background: #fef3c7; border-color: #f59e0b; }}
              .arrow {{ font-size: 22px; font-weight: 800; margin: 0 5px; }}
            </style>
          </head>
          <body>
            <h1>Qwen Transcript Boundary Audit</h1>

            <div class="card">
              <h2>Executive verdict</h2>
              <p><strong>Lean build:</strong> <span class="pass">{verdict(build_ok)}</span></p>
              <p><strong>Forbidden-token audit:</strong> <span class="pass">{verdict(no_forbidden)}</span></p>
              <p><strong>Real Qwen model:</strong> <code>{esc(qwen_summary["model"])}</code></p>
              <p><strong>Route-metadata lift:</strong> <span class="pass">+{qwen_summary["route_metadata_lift"]}</span> successful recoveries</p>
              <p><strong>False pass under transcript-only audit:</strong> <span class="pass">{qwen_summary["route_metadata_false_pass_under_transcript_audit"]}</span></p>
            </div>

            <h2>Security claim</h2>
            <p>Lean proves the valid post-processing boundary: <code>train : Transcript -> Student</code>.</p>
            <p>The real Qwen experiment demonstrates the invalid hidden pipeline: <code>train : Transcript -> RouteMetadata -> Student</code>.</p>

            <h2>Audit boundary</h2>
            <div class="boundary">
              <p><span class="node">Audited transcript</span><span class="arrow">→</span><span class="node">Qwen answer</span><span class="arrow">→</span><span class="node">Capability guess</span></p>
              <p>Valid theorem path: only transcript input is available.</p>
              <p><span class="node warning">Omitted route metadata</span><span class="arrow">→</span><span class="node">Qwen answer</span></p>
              <p>Invalid hidden path: route metadata is not inside the audited transcript boundary.</p>
            </div>

            <h2>Real Qwen result</h2>
            <img src="qwen_boundary_success.svg" alt="Qwen boundary success chart">

            <h2>Success by hidden capability label</h2>
            <img src="qwen_success_by_label.svg" alt="Qwen success by label chart">

            <h2>Theorem-to-experiment alignment</h2>
            {table_html(theorem_rows)}

            <h2>Qwen metrics</h2>
            {table_html(qwen_metric_rows)}

            <h2>Qwen predictions</h2>
            {table_html(prediction_rows)}

            <h2>Lean axiom audit</h2>
            <p>Forbidden-token scan: <strong>{verdict(no_forbidden)}</strong></p>
            <ul>
              {''.join('<li><code>' + esc(line) + '</code></li>' for line in theorem_lines)}
            </ul>

            <h2>Scope limitation</h2>
            <p>This artifact is a finite transcript-boundary audit. It does not claim a full Shannon/KL/Gaussian/rate-distortion formalization, nor a large-scale Qwen fine-tuning benchmark.</p>
          </body>
          </html>
          """
          (out / "index.html").write_text(html_doc, encoding="utf-8")

          md = []
          md.append("# Qwen Transcript Boundary Audit")
          md.append("")
          md.append("## Executive verdict")
          md.append("")
          md.append(f"- Lean build: {verdict(build_ok)}")
          md.append(f"- Forbidden-token audit: {verdict(no_forbidden)}")
          md.append(f"- Real Qwen model: `{qwen_summary['model']}`")
          md.append(f"- Transcript-only success: {qwen_summary['transcript_only_success']}/{qwen_summary['n_cases']}")
          md.append(f"- Transcript+route success: {qwen_summary['transcript_plus_route_metadata_success']}/{qwen_summary['n_cases']}")
          md.append(f"- Route-metadata lift: +{qwen_summary['route_metadata_lift']}")
          md.append(f"- False pass: {qwen_summary['route_metadata_false_pass_under_transcript_audit']}")
          md.append("")
          md.append("## Interpretation")
          md.append("")
          md.append("Lean certifies the transcript-only post-processing boundary. Real Qwen inference shows that omitted route metadata changes recovery success, so the theorem does not apply to that hidden pipeline.")
          (out / "REPORT.md").write_text("\n".join(md), encoding="utf-8")

          readme = f"""# Publishable Qwen audit artifacts

          Open `index.html` first.

          Main outputs:
          - `index.html`
          - `REPORT.md`
          - `qwen_boundary_success.svg`
          - `qwen_boundary_success.png`
          - `qwen_success_by_label.svg`
          - `qwen_success_by_label.png`
          - `qwen_metrics.csv`
          - `qwen_predictions.csv`
          - `theorem_alignment.csv`

          Main result:
          - Real Qwen model: `{qwen_summary['model']}`
          - Route metadata lift: `+{qwen_summary['route_metadata_lift']}`
          - False pass: `{qwen_summary['route_metadata_false_pass_under_transcript_audit']}`
          """
          (out / "README.md").write_text(readme, encoding="utf-8")

          manifest_files = []
          for p in sorted(Path(".").rglob("*")):
              if p.is_file():
                  parts = set(p.parts)
                  if ".git" in parts or ".venv" in parts or ".lake" in parts:
                      continue
                  if p.name.endswith(".zip"):
                      continue
                  manifest_files.append({
                      "path": str(p),
                      "sha256": hashlib.sha256(p.read_bytes()).hexdigest(),
                      "bytes": p.stat().st_size,
                  })

          manifest = {
              "artifact": "qwen-transcript-boundary-audit",
              "model": qwen_summary["model"],
              "headline": {
                  "transcript_only_success": qwen_summary["transcript_only_success"],
                  "transcript_plus_route_metadata_success": qwen_summary["transcript_plus_route_metadata_success"],
                  "route_metadata_lift": qwen_summary["route_metadata_lift"],
                  "false_pass": qwen_summary["route_metadata_false_pass_under_transcript_audit"],
              },
              "files": manifest_files,
          }
          Path("MANIFEST.json").write_text(json.dumps(manifest, indent=2), encoding="utf-8")
          (out / "MANIFEST.json").write_text(json.dumps(manifest, indent=2), encoding="utf-8")

          print("")
          print("=" * 110)
          print("QWEN TRANSCRIPT BOUNDARY AUDIT: PUBLISHABLE RESULT")
          print("=" * 110)
          print(f"Lean build: {verdict(build_ok)}")
          print(f"Forbidden-token audit: {verdict(no_forbidden)}")
          print(f"Real Qwen model: {qwen_summary['model']}")
          print(f"Transcript-only success: {qwen_summary['transcript_only_success']}/{qwen_summary['n_cases']}")
          print(f"Transcript+route success: {qwen_summary['transcript_plus_route_metadata_success']}/{qwen_summary['n_cases']}")
          print(f"Route-metadata lift: +{qwen_summary['route_metadata_lift']}")
          print(f"False pass: {qwen_summary['route_metadata_false_pass_under_transcript_audit']}")
          print("-" * 110)
          print("Generated artifacts:")
          for name in [
              "index.html",
              "REPORT.md",
              "qwen_boundary_success.svg",
              "qwen_boundary_success.png",
              "qwen_success_by_label.svg",
              "qwen_success_by_label.png",
              "qwen_metrics.csv",
              "qwen_predictions.csv",
              "theorem_alignment.csv",
              "MANIFEST.json",
          ]:
              print(f"- {out / name}")
          print("=" * 110)
          print("")

          step_summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if step_summary:
              with open(step_summary, "a", encoding="utf-8") as f:
                  f.write("\n## Qwen transcript boundary audit\n\n")
                  f.write(f"- Lean build: `{verdict(build_ok)}`\n")
                  f.write(f"- Real Qwen model: `{qwen_summary['model']}`\n")
                  f.write(f"- Route-metadata lift: `+{qwen_summary['route_metadata_lift']}`\n")
                  f.write(f"- False pass: `{qwen_summary['route_metadata_false_pass_under_transcript_audit']}`\n")
                  f.write(f"- HTML report: `{out / 'index.html'}`\n")
          PY
          chmod +x experiments/make_report.py

      - name: Install Lean via elan
        run: |
          set -euxo pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install selected Lean toolchain
        run: |
          set -euxo pipefail
          TOOLCHAIN="$(cat lean-toolchain)"
          if elan toolchain list | grep -Fxq "$TOOLCHAIN"; then
            echo "Toolchain already installed: $TOOLCHAIN"
          else
            elan toolchain install "$TOOLCHAIN"
          fi
          elan default "$TOOLCHAIN"
          lean --version | tee lean-version.log
          lake --version | tee lake-version.log

      - name: Show generated files
        run: |
          set -euxo pipefail
          find lean-toolchain lakefile.lean PACXAI.lean PACXAI scripts experiments README.md REPRODUCE.md LIMITATIONS.md THREAT_MODEL.md ARTIFACT_EVALUATION_README.md -type f \
            | sort | tee project-files.log

      - name: Build Lean proof artifact
        run: |
          set -euxo pipefail
          lake build 2>&1 | tee lean-build.log

      - name: Run Lean audit
        run: |
          set -euxo pipefail
          bash scripts/audit.sh 2>&1 | tee lean-audit.log

      - name: Run real Qwen/MLX transcript-boundary audit
        run: |
          set -euxo pipefail
          source .venv/bin/activate

          if [ -n "${{ github.event.inputs.qwen_model || '' }}" ]; then
            MODEL="${{ github.event.inputs.qwen_model }}"
          else
            MODEL="${DEFAULT_QWEN_MODEL}"
          fi

          python experiments/qwen_boundary_audit.py --model "$MODEL" 2>&1 | tee qwen-boundary-audit.log

      - name: Validate real Qwen boundary signal
        run: |
          set -euxo pipefail
          source .venv/bin/activate

          python - <<'PY'
          import json
          from pathlib import Path

          s = json.loads(Path("results/qwen_boundary_audit/summary.json").read_text())

          print("================================================================================")
          print("VALIDATION: REAL QWEN TRANSCRIPT BOUNDARY SIGNAL")
          print("================================================================================")
          print(json.dumps(s, indent=2))

          assert s["n_cases"] >= 6
          assert s["transcript_plus_route_metadata_success"] >= s["transcript_only_success"]
          assert s["route_metadata_lift"] > 0
          assert s["route_metadata_false_pass_under_transcript_audit"] is True

          print("Verdict: real Qwen route-metadata boundary signal PASS")
          print("================================================================================")
          PY

      - name: Generate publishable Qwen report, graphs, manifest
        run: |
          set -euxo pipefail
          source .venv/bin/activate
          python experiments/make_report.py

      - name: Build clean reviewer packet
        run: |
          set -euxo pipefail

          PACKET_ROOT="qwen-transcript-boundary-audit"
          rm -rf "$PACKET_ROOT"
          mkdir -p "$PACKET_ROOT/logs" "$PACKET_ROOT/.github/workflows"

          cp -R PACXAI "$PACKET_ROOT/"
          cp -R scripts "$PACKET_ROOT/"
          cp -R experiments "$PACKET_ROOT/"
          cp -R results "$PACKET_ROOT/"
          cp lean-toolchain lakefile.lean PACXAI.lean README.md REPRODUCE.md LIMITATIONS.md THREAT_MODEL.md ARTIFACT_EVALUATION_README.md MANIFEST.json "$PACKET_ROOT/"
          cp lean-version.log lake-version.log lean-build.log lean-audit.log qwen-boundary-audit.log project-files.log "$PACKET_ROOT/logs/"
          cp .github/workflows/*.yml "$PACKET_ROOT/.github/workflows/" 2>/dev/null || true

          cat > "$PACKET_ROOT/OPEN_ME_FIRST.md" <<'EOF'
          # Open me first

          Start here:

          1. Open `results/publishable_artifacts/index.html`.
          2. Read `results/publishable_artifacts/REPORT.md`.
          3. Inspect `results/qwen_boundary_audit/summary.json`.
          4. Inspect `logs/qwen-boundary-audit.log`.
          5. Inspect `logs/lean-audit.log`.
          6. Check `MANIFEST.json`.

          Main result:

          - Lean certifies only the transcript post-processing boundary.
          - Real Qwen inference shows route metadata changes recovery success.
          - Therefore a transcript-only audit can falsely pass if route metadata is omitted.
          EOF

          zip -r qwen-transcript-boundary-audit-reviewer-packet.zip "$PACKET_ROOT"

          echo "Reviewer packet created:"
          ls -lh qwen-transcript-boundary-audit-reviewer-packet.zip
          unzip -l qwen-transcript-boundary-audit-reviewer-packet.zip | sed -n '1,180p'

      - name: Prepare CI results
        if: always()
        run: |
          set -euxo pipefail

          rm -rf ci-results/latest
          mkdir -p ci-results/latest

          cp lean-version.log ci-results/latest/ 2>/dev/null || true
          cp lake-version.log ci-results/latest/ 2>/dev/null || true
          cp project-files.log ci-results/latest/ 2>/dev/null || true
          cp lean-build.log ci-results/latest/ 2>/dev/null || true
          cp lean-audit.log ci-results/latest/ 2>/dev/null || true
          cp qwen-boundary-audit.log ci-results/latest/ 2>/dev/null || true
          cp MANIFEST.json ci-results/latest/ 2>/dev/null || true

          if [ -d results ]; then
            mkdir -p ci-results/latest/results
            cp -R results/. ci-results/latest/results/
          fi

          cat > ci-results/latest/summary.md <<EOF
          # Qwen transcript boundary audit latest results

          - Workflow: ${GITHUB_WORKFLOW}
          - Run id: ${GITHUB_RUN_ID}
          - Run attempt: ${GITHUB_RUN_ATTEMPT}
          - Commit: ${GITHUB_SHA}
          - Generated at: $(date -u +%Y-%m-%dT%H:%M:%SZ)

          This workflow generated a self-contained Lean proof artifact and ran a real Qwen/MLX transcript-boundary audit.

          Main expected result:
          - Lean build succeeds.
          - Lean audit has no forbidden proof tokens.
          - Real Qwen route-metadata success exceeds transcript-only success.
          - Transcript-only audit can falsely pass when route metadata is omitted.
          EOF

          find ci-results/latest -type f | sort

      - name: Commit generated artifact outputs back to repo
        if: always() && github.event_name != 'pull_request'
        run: |
          set -euxo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            lean-toolchain \
            lakefile.lean \
            PACXAI.lean \
            PACXAI \
            scripts \
            experiments \
            results \
            ci-results/latest \
            README.md \
            REPRODUCE.md \
            LIMITATIONS.md \
            THREAT_MODEL.md \
            ARTIFACT_EVALUATION_README.md \
            MANIFEST.json

          if git diff --cached --quiet; then
            echo "No generated project/result changes to commit."
          else
            git commit -m "ci: generate Qwen transcript boundary audit artifact [skip ci]"
            git push
          fi

      - name: Upload Qwen reviewer packet
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qwen-transcript-boundary-audit-reviewer-packet
          path: |
            qwen-transcript-boundary-audit-reviewer-packet.zip
            qwen-transcript-boundary-audit/**
            lean-toolchain
            lakefile.lean
            PACXAI.lean
            PACXAI/**
            scripts/**
            experiments/**
            README.md
            REPRODUCE.md
            LIMITATIONS.md
            THREAT_MODEL.md
            ARTIFACT_EVALUATION_README.md
            MANIFEST.json
            lean-version.log
            lake-version.log
            project-files.log
            lean-build.log
            lean-audit.log
            qwen-boundary-audit.log
            results/**
            ci-results/latest/**
          if-no-files-found: ignore
          retention-days: 30
